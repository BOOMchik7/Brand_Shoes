<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Каталог — OUTFO</title><link rel="stylesheet" href="../CSS/style.css"></head>
<body>
  <header class="header"><div class="container nav"><a href="index.html" class="logo">OUTFO<span>.</span></a><nav class="desktop-nav"><a class="nav-active" href="catalog.html">Каталог</a><a href="about.html">Про нас</a><a href="delivery.html">Доставка</a><a href="contacts.html">Контакти</a></nav><button class="cart-btn" id="cartBtn" type="button">Кошик <span id="cartCount">0</span></button></div></header>
  <main class="catalog section"><div class="container"><div class="section-heading catalog-heading"><div><p class="eyebrow">ТОВАРИ</p><h1>Наш каталог</h1></div><div class="catalog-tools"><input id="catalogSearch" type="search" placeholder="Знайти товар..."></div></div><div class="catalog-layout"><aside class="catalog-sidebar"><div class="filter-toggle"><span>Фільтри</span></div><div class="filter-panel"><div class="filter-group"><p class="filter-title">Для кого</p><label class="radio-option"><input type="radio" name="catalogGender" value="all" checked> Усі</label><label class="radio-option"><input type="radio" name="catalogGender" value="female"> Жіноче</label><label class="radio-option"><input type="radio" name="catalogGender" value="male"> Чоловіче</label></div><div class="filter-group"><p class="filter-title">Ціна, грн</p><div class="price-fields"><input id="catalogPriceFrom" type="number" placeholder="Від"><input id="catalogPriceTo" type="number" placeholder="До"></div></div></div></aside><div class="catalog-products"><div class="product-grid" id="catalogGrid"></div><div class="empty-state hidden" id="catalogEmpty"><h3>Нічого не знайдено</h3></div></div></div></div></main>
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer"><div class="cart-header"><h2>Ваш кошик</h2><button class="close-btn" id="closeCart" aria-label="Закрити">×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-footer"><div class="total-row"><span>Разом:</span><strong id="cartTotal">0 грн</strong></div><button class="primary-btn full" id="checkoutBtn" type="button">Оформити замовлення</button></div></aside>
  <div class="modal" id="catalogModal"><div class="modal-card"><button class="close-btn modal-close" id="closeCatalogModal" aria-label="Закрити">×</button><div id="catalogModalContent"></div></div></div>
  <div class="modal" id="checkoutModal"><div class="modal-card checkout-card"><button class="close-btn modal-close" id="closeCheckout" aria-label="Закрити">×</button><p class="eyebrow">ЗАМОВЛЕННЯ</p><h2>Оформити замовлення</h2><p class="modal-note">Залиште контакти — ми зв’яжемося з вами для підтвердження.</p><form id="checkoutForm"><label>Ваше ім’я<input id="customerName" name="name" type="text" required></label><label>Номер телефону<input id="customerPhone" name="phone" type="tel" required placeholder="+380..."></label><label>Viber (опціонально)<input id="customerViber" name="viber" type="text" placeholder="Номер або посилання"></label><label>Telegram (опціонально)<input id="customerTelegram" name="telegram" type="text" placeholder="Юзернейм або номер"></label><label>Коментар<textarea id="customerComment" name="comment" rows="3" placeholder="Розмір, колір або побажання"></textarea></label><button class="primary-btn full" type="submit">Надіслати замовлення</button></form><div class="success-message hidden" id="successMessage"><div class="success-icon">✓</div><h3>Дякуємо за замовлення!</h3><p>Ми зв’яжемося з вами найближчим часом.</p></div></div></div>
  <script defer src="../JS/catalog.js"></script>
</body></html>
